# lpbridge guest cupsd -- the distro's print server, minus the desktop.
#
# The Mac is the only client (the guest's NIC is a private NAT interface of
# the Mac; the podman variant publishes 631 on 127.0.0.1 only), so there is no
# authentication: every operation is allowed from anywhere that can reach the
# socket. Queues are added by the lpbridge agent, jobs come in over IPP from
# the lpbridge virtual printer, output leaves through the printer's own
# network backend or the `lpbridge` backend (USB, relayed by the Mac).
LogLevel warn
MaxLogSize 0
PageLogFormat

Listen 0.0.0.0:631
Listen /run/cups/cups.sock
ServerAlias *
ServerName lpbridge-engine

Browsing Off
BrowseLocalProtocols none
DefaultAuthType Basic
DefaultEncryption Never
WebInterface No
IdleExitTimeout 0

# Completed jobs stay queryable (job state / reasons) but their spool files
# are dropped; the Mac keeps the honest record.
# write printers.conf right away: a queue must survive a cupsd restart
DirtyCleanInterval 0
PreserveJobHistory Yes
PreserveJobFiles No
MaxJobs 500
MaxJobsPerPrinter 100

# A queue whose filter/backend fails keeps accepting jobs: the lpbridge job
# state carries the reason to macOS, and stopping the queue would hide it.
ErrorPolicy retry-current-job

<Location />
  Order allow,deny
  Allow all
</Location>
<Location /admin>
  Order allow,deny
  Allow all
</Location>
<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit All>
    Order deny,allow
    Allow all
  </Limit>
</Policy>
