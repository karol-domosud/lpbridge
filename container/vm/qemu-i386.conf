# 32-bit x86 ELF -> qemu-i386 (user-mode emulation). x86-64 is deliberately
# not registered here: lpbridge-x86-64.service picks FEX or qemu-x86_64.
:qemu-i386:M::\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x03\x00:\xff\xff\xff\xff\xff\xfe\xfe\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-i386-static:OCF
