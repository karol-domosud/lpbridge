# The engine's shell for the user: key-only, root, on the NAT interface that
# only the Mac can reach -- and only while the Mac holds a shell open
# (ssh.service is not enabled; the agent starts and stops it per hold).
# The key is generated on the Mac by the agent and installed by the guest
# agent at every boot (/spool/.ssh-authorized-keys), restricted to the NAT
# gateway address, which is the Mac itself.
#
# Nothing here may turn the engine into a relay: no forwarding of any kind.
# Root in this guest already reaches the LAN through NAT; that is what the
# vendor installers need, and it is stated in the MOTD rather than hidden.
AllowUsers root
PermitRootLogin prohibit-password
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 3:50:10
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
X11Forwarding no
PermitUserEnvironment no
PrintMotd yes
ClientAliveInterval 30
ClientAliveCountMax 3
UseDNS no
