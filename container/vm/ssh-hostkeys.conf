# The image ships no host keys (every user's engine gets its own), so they
# must exist before the unit's own `sshd -t` config check runs: reset the
# ExecStartPre list and put ssh-keygen first. The unit is not enabled: the
# agent starts it per shell (after the guest agent installed the user's key)
# and stops it when the last shell closes.
[Unit]
After=lpbridge-vm-agent.service
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
